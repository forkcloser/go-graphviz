# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out. `just do lint go` renders the two on every run
# (book/per-language.md, "one baseline, per-project carve-outs"). Seeded once;
# the file is the project's own. Every key the overlay accepts is below, with
# what it does to the baseline; anything else is refused as baseline policy.
#
# golangci:
#   linters:
#     disable:                       # takes a linter out of the baseline's set
#       - zerologlint
#     enable:                        # adds one the baseline turns off
#       - godox
#     exclusions:
#       paths:                       # appends: files golangci-lint skips entirely
#         - third_party/
#       presets:                     # appends golangci-lint's exclusion presets
#         - comments
#       rules:                       # appends: linters, or a finding text, off under a path.
#         # The baseline exempts tests from gocognit, goconst, gosec,
#         # varnamelen and wrapcheck; anything else a project tolerates there
#         # is its own. The reviewed shape, to tailor: tests are black-box
#         # consumers, so the rules about API hygiene and production
#         # robustness do not apply to them, while the rules about correctness
#         # do (errcheck stays on: a test that ignores an error can pass for
#         # the wrong reason).
#         - path: _test\.go
#           linters:
#             - dupl # test cases are meant to look alike
#             - dupword # test data
#             - err113 # dynamic errors are fine in fixtures
#             - dogsled # multiple-return helpers are exercised for one value at a time
#             - noctx # no cancellation to propagate
#             - perfsprint # readability over allocations
#             - mnd # fixture values
#     settings:                      # per linter, merged key by key into the baseline's:
#       wrapcheck:                   #   a scalar overrides, a mapping recurses, a list appends,
#         ignore-package-globs:      #   a named entry (a revive rule) overrides its namesake
#           - github.com/example/project/*
#   formatters:
#     enable:                        # adds a formatter (the baseline runs gci, gofumpt, golines, goimports)
#       - swaggo
#     exclusions:
#       paths:                       # appends: files the formatters skip
#         - internal/generated/
#     settings:                      # per formatter, merged like the linters'
#       golines:
#         max-len: 100
#       gci:
#         sections:                  # go in before the module's own group: a sibling
#           - prefix(github.com/example-sibling)  # organization's imports group next to this one's
# licenses:
#   allowed:                         # replaces the baseline's list of accepted dependency licenses
#     - Apache-2.0
#     - MIT
#   ignore:                          # appends modules go-licenses skips (its known false positives)
#     - gotest.tools/v3
# nilaway:
#   blocking: false                  # findings print without failing the lane, while a backlog is worked off
#   exclude-pkgs:                    # appends package prefixes NilAway leaves out
#     - github.com/example/project/internal/generated
#   exclude-errors-in-files:         # appends file prefixes: NilAway has no per-line suppression
#     - internal/legacy/

golangci:
  linters:
    disable:
      # The module runs one WebAssembly instance of Graphviz, created at init
      # and shared by every Graph and Context; wazero documents that calling a
      # function of one instance from two goroutines is not safe, and
      # Graphviz keeps global state behind it (its error buffer, the plugin
      # registry, the layout engines' statics). Callers serialize their use
      # of the library, and the tests must not run concurrently either: a
      # parallel test would race the instance, not exercise the code. The
      # linter that asks every test for t.Parallel is therefore off, as a
      # judgment, not a backlog item.
      - paralleltest
    exclusions:
      paths:
        # Generated by `just bindings` from internal/wasm/bind.proto; the
        # generator, not its output, is what review reads.
        - internal/wasm/bind.go
      rules:
        # Every call into the WebAssembly module takes a context because wazero
        # requires one per call, field reads included; the gvc accessors (Job,
        # PointFloat, Object...) read fields and have no context parameter by
        # design, so they pass Background. contextcheck reads that as a dropped
        # cancellation; nothing is cancelled by a memory read, and threading a
        # context through every accessor would change the public API for no
        # observable effect.
        - path: ^gvc/
          linters:
            - contextcheck
        # ---------------------------------------------------------------------------
        # ONBOARDING BACKLOG. Not a judgment: these are the findings the baseline
        # raised on code that predates it, exempted so the enrolment lands green
        # (book/mandatory-files.md, "Onboarding an existing repository"). Nobody has
        # read them yet. Alignment empties this block one linter or one package per
        # pull request, each finding fixed, silenced inline with its reason, or
        # raised as a rule; the last alignment pull request deletes the block.
        # Counts are the measurement at enrolment, per file and linter.
        # ---------------------------------------------------------------------------
        - path: ^alias\.go$
          linters: # 111 findings
            - gochecknoglobals # 21
        - path: ^cgraph/attribute\.go$
          linters: # 487 findings
            - errcheck # 210
            - gochecknoglobals # 2
        - path: ^cgraph/cgraph\.go$
          linters: # 280 findings
            - errcheck # 49
            - gochecknoglobals # 5
        - path: ^cgraph/init\.go$
          linters: # 23 findings
            - errcheck # 9
            - gochecknoglobals # 4
            - gochecknoinits # 1
        - path: ^compatible_test\.go$
          linters: # 19 findings
            - errcheck # 4
            - gochecknoglobals # 2
        - path: ^graphviz16_test\.go$
          linters: # 11 findings
            - errcheck # 6
        - path: ^graphviz_test\.go$
          linters: # 28 findings
            - errcheck # 5
        - path: ^gvc/device_plugin\.go$
          linters: # 30 findings
            - gochecknoglobals # 7
            - errcheck # 4
        - path: ^gvc/fontfind\.go$
          linters: # 4 findings
            - gochecknoglobals # 1
        - path: ^gvc/image_renderer\.go$
          linters: # 124 findings
            - gochecknoglobals # 5
            - errcheck # 2
        - path: ^gvc/init\.go$
          linters: # 6 findings
            - gochecknoinits # 1
        - path: ^gvc/render_plugin\.go$
          linters: # 440 findings
            - errcheck # 69
            - gochecknoglobals # 47
        - path: ^internal/wasm/ext\.go$
          linters: # 20 findings
            - gochecknoglobals # 1
        - path: ^alias\.go$
          linters: [revive]
          text: '^exported:' # 90 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^cgraph/attribute\.go$
          linters: [revive]
          text: '^exported:' # 254 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^cgraph/cgraph\.go$
          linters: [revive]
          text: '^exported:' # 200 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^cgraph/init\.go$
          linters: [revive]
          text: '^exported:' # 1 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^graphviz\.go$
          linters: [revive]
          text: '^exported:' # 18 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^gvc/device_plugin\.go$
          linters: [revive]
          text: '^exported:' # 12 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^gvc/gvc\.go$
          linters: [revive]
          text: '^exported:' # 13 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^gvc/image_plugin\.go$
          linters: [revive]
          text: '^exported:' # 7 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^gvc/image_renderer\.go$
          linters: [revive]
          text: '^exported:' # 35 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^gvc/render_plugin\.go$
          linters: [revive]
          text: '^exported:' # 294 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^internal/wasm/ext\.go$
          linters: [revive]
          text: '^exported:' # 7 revive findings at enrolment; only the doc-comment rule stays exempt
        - path: ^option\.go$
          linters: [revive]
          text: '^exported:' # 3 revive findings at enrolment; only the doc-comment rule stays exempt
    settings:
      depguard:
        rules:
          main:
            allow:
              # The module's declared dependencies: the WebAssembly runtime the
              # embedded Graphviz runs on, and the Go team's image, font,
              # vector and draw packages the raster renderer draws with.
              - github.com/tetratelabs/wazero
              - golang.org/x/image
      # internal/wasm is this module's own binding, generated from bind.proto;
      # an error it returns is already the module's own, and cgraph and gvc
      # are the thin typed layer over it, as the root package is over them.
      # Wrapping at those boundaries would add a second, identical message to
      # every call; errors from other modules and the standard library are
      # wrapped where they arise.
      wrapcheck:
        ignore-package-globs:
          - github.com/forkcloser/go-graphviz/internal/wasm
          - github.com/forkcloser/go-graphviz/cgraph
          - github.com/forkcloser/go-graphviz/gvc
      revive:
        rules:
          # revive counts public type declarations per file. The root package
          # re-exports every type of cgraph and gvc as aliases so one
          # import covers the API, and cgraph and gvc mirror libcgraph's and
          # libgvc's structs and enums one to one; the counts are the C API's
          # and the facade's, not a design to shrink, so the rule is off.
          - name: max-public-structs
            disabled: true
  formatters:
    exclusions:
      paths:
        # Generated, as above, and nori.pb.go by protoc from the generator's
        # own schema. The formatting lane reaches nori's module; golangci-lint's
        # run does not, and reports both entries as matching nothing.
        - internal/wasm/bind.go
        - internal/tools/nori/nori/nori.pb.go
nilaway:
  # ONBOARDING BACKLOG, not a judgment: NilAway's findings print without
  # failing the lane until alignment reaches them.
  blocking: false
