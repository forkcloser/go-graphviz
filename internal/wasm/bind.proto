  string stringtype = 8 [(nori.field).type.kind = CHARPTR];
  int64 x = 9;
  int64 y = 10;
  int64 w = 11;
  int64 h = 12;
  int64 dpi = 13;
  nori.Any data = 14 [(nori.field).type.kind = VOIDPTR];
