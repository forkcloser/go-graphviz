// cdt.h

message DictMethod {
  option (nori.message).alias = "Dtmethod_t";

  int64 type = 2;
}

message DictData {
  option (nori.message).alias = "Dtdata_t";

  int64 type = 1;
  int64 size = 6;
}

message Dict {
  option (nori.message).alias = "Dict_t";

  DictData data = 3;
}

message DictStat {
  option (nori.message).alias = "Dtstat_t";

}

message DictWalk {
  option (nori.message).funcptr = {
    args {
      kind: VOIDPTR
      funcbaseptr: true
    }
    args { kind: VOIDPTR }
    return { kind: INT }
  };
}

option (nori.file).export = {
  header: [
    "cgraph.h",
    "gvc.h",
    "gvcjob.h",
    "cdt.h",
    "gvplugin_device.h",
    "gvplugin_render.h",
    "gvplugin_layout.h",
    "gvplugin_loadimage.h",
    "gvplugin_textlayout.h"
  ]
  method {
    recv: "Dict"
    name: "close"
    alias: "dtclose"
    return { kind: INT }
  }
  method {
    recv: "Dict"
    name: "method"
    alias: "dtmethod"
    args {
      kind: STRUCT
      ref: "DictMethod"
      pointer: 1
    }
    return {
      kind: STRUCT
      ref: "DictMethod"
      pointer: 1
    }
  }
  method {
    recv: "Dict"
    name: "walk"
    alias: "dtwalk"
    args {
      kind: FUNCPTR
      ref: "DictWalk"
    }
    args { kind: VOIDPTR }
    return { kind: INT }
  }
  method {
    recv: "Dict"
    name: "size"
    alias: "dtsize"
    return { kind: INT }
  }
  method {
    recv: "Dict"
    name: "stat"
    alias: "dtstat"
    args {
      kind: STRUCT
      ref: "DictStat"
      pointer: 1
    }
    args { kind: INT }
    return { kind: INT }
  }
};

// gvc.h

message File {
  option (nori.message) = {
    alias: "FILE"
    constructor: false
  };
}

message Context {
  option (nori.message).alias = "GVC_t";

  repeated PluginAvailable apis = 5 [(nori.field).type = {
    pointer: 1
    array: true
    array_num: 5
  }];
  repeated PluginAvailable api = 6 [(nori.field).type = {
    pointer: 1
    array: true
    array_num: 5
  }];
}

message PluginAvailable {
  option (nori.message).alias = "gvplugin_available_t";

  int64 quality = 3;
  PluginPackage package = 4 [(nori.field).type.pointer = 1];
  PluginInstalled typeptr = 5 [(nori.field).type.pointer = 1];
}

message PluginPackage {
  option (nori.message).alias = "gvplugin_package_t";

  string name = 3 [(nori.field).type.kind = CHARPTR];
}

message SymList {
  option (nori.message).alias = "lt_symlist_t";

  string name = 1;
  PluginLibrary address = 2 [(nori.field).type.pointer = 1];
}

