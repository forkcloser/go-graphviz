# Seeded once by `limen fix`, then the project's own: limen never updates it.
# Realign it by hand when limen's canonical moves, and comment every project
# line so the next alignment keeps it.
#
# Minimal glue: GitHub's own actions pinned by SHA, aqua at .aqua/aqua.yaml's pins,
# `just` running the recipes a laptop runs. No third-party actions, hence no
# egress-filtering action either.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash everywhere: windows defaults to PowerShell and never sees
# git-bash's environment; explicit bash also brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images, never -latest. macOS is not redundant: its /bin/bash is
        # 3.2, the floor the recipes target. Both windows legs run under
        # git-bash. These names are NOT the ruleset's required contexts —
        # `gate` is, so this list can change freely.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # Generous for the windows legs, which are markedly slower.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left behind in .git/config: nothing in this
          # workflow talks to GitHub after checkout.
          persist-credentials: false
          # Full history and refs: `just do lint commits` validates the commit
          # range against the PR's base branch, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      # Not here: turning Defender's real-time scan off. Tried on the windows
      # legs, before the caches, and measured neutral twice against the same
      # commit without it — the slowness is process creation and small-file
      # writes under git-bash, not the scanner.

      # aqua's package store, keyed on the exact pins and per architecture
      # (the store holds native binaries). A warm store turns every lazy first
      # use below into a link; the fallback key keeps the tools a pin bump did
      # not touch, and the changed one downloads and verifies as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AQUA_ROOT_DIR }}/pkgs
          key: aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/aqua.yaml', '.aqua/aqua-checksums.json', '.limen/aqua-registry.yaml') }}
          restore-keys: |
            aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned tools
        # Link-only: tools download lazily on first use, checksum-verified; a
        # job pays only for what its recipes run.
        run: aqua install --only-link

      # The Go build and module caches, plus the linter's (build/cache/, see
      # main.just). The per-platform analysis legs compile the whole module
      # graph five times, cold, on every run without this. Paths come from the
      # pinned go itself — they differ per OS — and the key carries its version
      # and every go.sum; a stale restore is harmless (the build cache is
      # content-addressed, the module cache is checksum-verified), so the
      # fallback key is always worth taking.
      - id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
            build/cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.gocache.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.gocache.outputs.version }}-
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Lint
        run: just lint

      - name: Test
        run: just test

  # One linux leg, not the matrix: fuzzing explores the same corpus wherever
  # it runs, so more legs cost CPU and add nothing. The recipe passes on a
  # tree with no targets or no Go module, so this job is safe in every
  # repository.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Install pinned tools
        run: aqua install --only-link

      # The cached corpus is what makes fuzzing cumulative across runs. Keyed
      # on the fuzz sources so a changed target restarts its corpus;
      # restore-keys keep the rest.
      - id: fuzzdir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzzdir.outputs.dir }}
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('**/*_fuzz_test.go', '**/fuzz_test.go') }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Fuzz
        run: just do test go fuzz

      # A crasher is a bug with a reproducer attached; the log names the
      # target, the input file is what reproduces it locally. Uploaded only
      # on failure, and only if any was written.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/'
          if-no-files-found: ignore

  # Every pin resolves. The verify legs link only, and a link verifies
  # nothing: an asset that is missing from a release, or that fails its
  # checksum, would merge green and fail at first use. One linux leg pays for
  # the real install; aqua's package store is cached on the exact pins, so a
  # warm key costs seconds and a changed pin is always a real install. (The
  # Go-built tools are tools/go.mod directives, built by the verify legs.)
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AQUA_ROOT_DIR }}/pkgs
          # The same key as the verify legs', so this job and the linux leg
          # share one store — and no fallback key here: a changed pin must be
          # a real install, which is what this job exists to prove.
          key: aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/aqua.yaml', '.aqua/aqua-checksums.json', '.limen/aqua-registry.yaml') }}

      - name: Install every pinned tool
        run: aqua install

  # Project job: the committed internal/wasm/graphviz.wasm is what `just wasm`
  # produces from pins.yaml, byte for byte, on any host. Two builds from two
  # work directories, on Linux x86_64 and macOS arm64, each compared with the
  # committed file; a pin that moves without its blob, or a blob nobody can
  # rebuild from the tree, fails here. The toolchain downloads (~200 MB per
  # host) are cached on the pins.
  wasm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Install pinned tools
        run: aqua install --only-link

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wasm/dl
          key: wasm-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pins.yaml') }}

      - name: Build once
        run: just wasm
      - name: Digests, for the log
        run: shasum -a 256 build/wasm/out/graphviz.raw.wasm internal/wasm/graphviz.wasm
      - name: The build matches the committed blob
        run: git diff --exit-code --stat -- internal/wasm/graphviz.wasm
      - name: Build again, elsewhere
        # The downloads are reused; everything else is unpacked and built anew.
        run: |
          mkdir -p "${RUNNER_TEMP}/wasm-b/dl"
          cp build/wasm/dl/* "${RUNNER_TEMP}/wasm-b/dl/"
          WORK="${RUNNER_TEMP}/wasm-b" just wasm
      - name: The second build matches too
        run: git diff --exit-code --stat -- internal/wasm/graphviz.wasm
      # The blob is built from bind.c, which nori generates from bind.proto
      # with bind.go; a hand edit to either would pass every check above.
      - name: The generated bridge matches its generator
        run: |
          just bindings
          git diff --exit-code --stat -- internal/wasm/bind.go internal/wasm/build/bind.c

  # The ONE required status check (defaultRequiredChecks in
  # internal/github/audit.go). Requiring the matrix legs by name would bake
  # this runner list into every ruleset; this job collapses the matrix to one
  # stable name.
  gate:
    needs: [verify, fuzz, tools, wasm] # wasm: project job, see above
    # always(), and the result asserted explicitly. Without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge — branch protection that
    # quietly stops protecting. `needs.verify.result` is success only when
    # every matrix leg succeeded; fuzz and tools are asserted alongside so a
    # crasher, or a pin that does not build, blocks a merge the same way a
    # failing test does.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every verify leg, fuzz and tools succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          RESULT: ${{ needs.verify.result }}
          RESULT_FUZZ: ${{ needs.fuzz.result }}
          RESULT_TOOLS: ${{ needs.tools.result }}
          RESULT_WASM: ${{ needs.wasm.result }} # project job
        run: |
          printf 'verify: %s\n' "$RESULT"
          printf 'fuzz: %s\n' "$RESULT_FUZZ"
          printf 'tools: %s\n' "$RESULT_TOOLS"
          printf 'wasm: %s\n' "$RESULT_WASM"
          [ "$RESULT" = "success" ] && [ "$RESULT_FUZZ" = "success" ] && [ "$RESULT_TOOLS" = "success" ] && [ "$RESULT_WASM" = "success" ]
