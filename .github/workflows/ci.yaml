# Seeded once by `limen fix`, then the project's own: limen never updates it.
# The shared lanes (verify on every platform, fuzz, tools) live in
# limen-verify.yaml, content-pinned and kept current by `limen fix`; this file
# calls them, adds the project's own jobs, and gates on all of them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  limen:
    uses: farcloser/limen/.github/workflows/limen-verify.yaml@558f7ae692e9df0c5055e9ac2d1d6c66172544f3 # v0.31.0
    permissions:
      contents: read
      # A project that needs another runner set passes it here, e.g.
      # with:
      #   os: '["ubuntu-24.04", "macos-15"]'

  # Project job: the committed internal/wasm/graphviz.wasm is what `just wasm`
  # produces from pins.yaml, byte for byte, on any host. Two builds from two
  # work directories, on Linux x86_64 and macOS arm64, each compared with the
  # committed file; a pin that moves without its blob, or a blob nobody can
  # rebuild from the tree, fails here. The first is limen's converge lane,
  # which also fails when the build touches a file .converge does not
  # declare, as the checksum workflow would refuse a Renovate branch for. It
  # runs here and not in `lint`: the lane runs where the recipe runs, and the
  # build's toolchain is pinned for three hosts of the five lint runs on.
  # The toolchain downloads (~200 MB per host) are cached on the pins.
  wasm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    # Explicit bash: it brings -eo pipefail, which the default shell lacks.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      # The downloads are fully determined by pins.yaml, so the exact key or
      # nothing. Saved as the canonical lanes save theirs: on the default
      # branch only, read from the event, and only on a miss (caches.yaml).
      - id: inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wasm/dl
          key: wasm-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pins.yaml') }}

      - name: Build once, to the committed blob and no other file
        run: just do lint converge
      # Whatever the lane said: when it refuses the build, it has put the
      # committed module back, and the raw one is what tells the two apart.
      - name: Digests, for the log
        if: always()
        run: sha256sum build/wasm/out/graphviz.raw.wasm internal/wasm/graphviz.wasm
      - name: Build again, elsewhere
        # The downloads are reused; everything else is unpacked and built anew.
        run: |
          mkdir -p "${RUNNER_TEMP}/wasm-b/dl"
          cp build/wasm/dl/* "${RUNNER_TEMP}/wasm-b/dl/"
          WORK="${RUNNER_TEMP}/wasm-b" just wasm
      - name: The second build matches too
        run: git diff --exit-code --stat -- internal/wasm/graphviz.wasm
      # The blob is built from bind.c, which nori generates from bind.proto
      # with bind.go; a hand edit to either would pass every check above.
      - name: The generated bridge matches its generator
        run: |
          just bindings
          git diff --exit-code --stat -- internal/wasm/bind.go internal/wasm/build/bind.c

      - if: (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && steps.inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wasm/dl
          key: ${{ steps.inputs.outputs.cache-primary-key }}

  # The ONE required status check (defaultRequiredChecks in
  # internal/github/audit.go). Requiring the lanes by name would bake the
  # runner list into every ruleset; this job collapses them to one stable
  # name. A project job joins `needs` and the assertion below.
  gate:
    needs: [limen, wasm] # wasm: project job, see above
    # always(), and the result asserted explicitly. Without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge — branch protection that
    # quietly stops protecting. `needs.limen.result` is success only when
    # every lane it ran succeeded: each verify leg, fuzz and tools.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every lane succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          RESULT: ${{ needs.limen.result }}
          RESULT_WASM: ${{ needs.wasm.result }} # project job
        shell: bash
        run: |
          printf 'limen: %s\n' "$RESULT"
          printf 'wasm: %s\n' "$RESULT_WASM"
          [ "$RESULT" = "success" ] && [ "$RESULT_WASM" = "success" ]
