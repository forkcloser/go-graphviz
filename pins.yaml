# The inputs of internal/wasm/graphviz.wasm, pinned by version and digest
# (book/tooling.md, "Pinned artifacts beyond aqua"). internal/wasm/build/build.sh
# reads each entry back with `limen pins get <name> url|sha256`, Renovate
# proposes the bumps from the renovate: lines, and `limen pins refresh`
# recomputes a digest a bump left behind. None of these projects signs its
# assets in a form limen verifies, so the method is the download itself: TLS
# at refresh time, the digest at every build after.
#
# wasi-sdk and binaryen come as one archive per host; the four hosts the
# build runs on (CI's Linux x86_64, the Linux arm64 and macOS arm64 of
# laptops and microVMs, macOS x86_64) are four entries each, moved together.
pins:
  - name: graphviz
    renovate: gitlab-releases graphviz/graphviz
    version: 16.1.0
    url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/${version}/graphviz-${version}.tar.gz
    verify: download
    digest:
      version: 16.1.0
      sha256: beea483ab130f456c1c3905f4f2e40778a9c493c3d73ae8012367d552d71ca84
  - name: expat
    renovate: github-tags libexpat/libexpat
    versioning: regex:^R_(?<major>\d+)_(?<minor>\d+)_(?<patch>\d+)$
    version: R_2_9_0
    url: https://github.com/libexpat/libexpat/archive/refs/tags/${version}.tar.gz
    verify: download
    digest:
      version: R_2_9_0
      sha256: 6e8ce7b52ebbaa423c59becc7cf1e6875c42e49228c062ac8123c10e700cec27
  - name: wasi-sdk-linux-amd64
    renovate: github-releases WebAssembly/wasi-sdk
    extract-version: ^wasi-sdk-(?<version>\d+)$
    version: 34
    url: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${version}/wasi-sdk-${version}.0-x86_64-linux.tar.gz
    verify: download
    digest:
      version: 34
      sha256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
  - name: wasi-sdk-linux-arm64
